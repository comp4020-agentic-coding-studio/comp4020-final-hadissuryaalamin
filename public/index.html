<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cleaner Performance &amp; Property Preference</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="narrow">
    <form id="login-form" class="card signin">
      <h1>Cleaner Performance &amp; Property Preference</h1>
      <p>Sign in with the account your admin gave you.</p>
      <label>
        Username
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="primary">Sign in</button>
      <p class="status" id="login-status" role="status"></p>
    </form>
    <footer><a href="/readme/">About this app</a></footer>
    <script>
      const form = document.getElementById("login-form");
      const status = document.getElementById("login-status");

      function destinationFor(role) {
        return "/home.html";
      }

      // Already signed in? Skip straight to the right dashboard.
      // /api/me is 200 for a cleaner session, 404 ("Not a cleaner") for an
      // authenticated admin session, 401 for no session at all.
      (async () => {
        try {
          const res = await fetch("/api/me");
          if (res.status === 200) {
            location.href = destinationFor("cleaner");
          } else if (res.status === 404) {
            location.href = destinationFor("admin");
          }
        } catch {
          // Server unreachable — just show the login form.
        }
      })();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.className = "status";
        status.textContent = "Signing in…";
        const data = new FormData(form);
        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              username: data.get("username"),
              password: data.get("password"),
            }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            status.className = "status error";
            status.textContent = body.error ?? "Sign in failed.";
            return;
          }
          const user = await res.json();
          status.className = "status ok";
          status.textContent = `Signed in as ${user.username} (${user.role}).`;
          location.href = destinationFor(user.role);
        } catch {
          status.className = "status error";
          status.textContent = "Could not reach the server.";
        }
      });
    </script>
  </body>
</html>
