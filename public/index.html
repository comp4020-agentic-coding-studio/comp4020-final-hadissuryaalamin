<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StayCrew · Cleaner Performance &amp; Property Preference</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="signin-body">
    <div class="signin-wrap">
      <div class="signin-brand">
        <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--green-900)"/><path d="M9 20.5 20 11l11 9.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M26.5 13.2V10h2.6v5.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><path d="M20 17.5l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="var(--gold-400)"/></svg>
        <strong>Stay<span>Crew</span></strong>
      </div>
      <form id="login-form" class="card signin">
        <h1>Cleaner Performance &amp; Property Preference</h1>
        <p>Sign in with the account your admin gave you.</p>
        <label>
          Username
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="primary">Sign in</button>
        <p class="status" id="login-status" role="status"></p>
      </form>
      <p class="signin-foot"><a href="/readme/">About this app</a></p>
    </div>
    <script>
      const form = document.getElementById("login-form");
      const status = document.getElementById("login-status");

      function destinationFor(role) {
        return "/home.html";
      }

      // Already signed in? Skip straight to the right dashboard.
      // /api/me is 200 for a cleaner session, 404 ("Not a cleaner") for an
      // authenticated admin session, 401 for no session at all.
      (async () => {
        try {
          const res = await fetch("/api/me");
          if (res.status === 200) {
            location.href = destinationFor("cleaner");
          } else if (res.status === 404) {
            location.href = destinationFor("admin");
          }
        } catch {
          // Server unreachable — just show the login form.
        }
      })();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.className = "status";
        status.textContent = "Signing in…";
        const data = new FormData(form);
        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              username: data.get("username"),
              password: data.get("password"),
            }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            status.className = "status error";
            status.textContent = body.error ?? "Sign in failed.";
            return;
          }
          const user = await res.json();
          status.className = "status ok";
          status.textContent = `Signed in as ${user.username} (${user.role}).`;
          location.href = destinationFor(user.role);
        } catch {
          status.className = "status error";
          status.textContent = "Could not reach the server.";
        }
      });
    </script>
  </body>
</html>
