<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Admin dashboard</h1>
      <div class="who">
        <span id="whoami">loading…</span>
        <button id="logout" type="button">Sign out</button>
      </div>
    </header>

    <nav class="tabs">
      <a href="/admin.html" aria-current="true">Dashboard</a>
      <a href="/properties.html">Properties</a>
      <a href="/reviews.html">Reviews</a>
    </nav>

    <p id="summary" class="muted"></p>

    <div class="dashboard-grid">
      <section id="cleaners-card" class="card">
        <h2>Cleaners</h2>
        <div class="card-scroll">
          <table>
            <thead>
              <tr><th>Cleaner</th><th>Rank</th><th class="num">Score</th><th>Preferred properties</th></tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
      </section>

      <section id="actions-card" class="card">
        <h2>Quick actions</h2>

        <h3>Create cleaner account</h3>
        <form id="add-cleaner-form" class="inline-form">
          <label>Username <input type="text" name="username" required /></label>
          <label>Password <input type="password" name="password" required /></label>
          <button type="submit" class="primary">Create account</button>
        </form>
        <p id="cleaner-status" class="status" role="status"></p>

        <h3>Manual rank override</h3>
        <form id="rank-form" class="inline-form">
          <label>
            Cleaner
            <select name="cleaner_id" id="rank-cleaner-select" required></select>
          </label>
          <label>
            New rank
            <select name="rank" required>
              <option value="legend">legend</option>
              <option value="awesome">awesome</option>
              <option value="normal">normal</option>
            </select>
          </label>
          <button type="submit" class="primary">Set rank</button>
        </form>
        <p id="rank-status" class="status" role="status"></p>

        <h3>More</h3>
        <p class="muted">
          Manage the property list on <a href="/properties.html">Properties</a>.
          Submit this month's star ratings (one by one or as a CSV) on
          <a href="/reviews.html">Reviews</a>.
        </p>
      </section>
    </div>

    <footer><a href="/readme/">About this app</a></footer>

    <script>
      const whoami = document.getElementById("whoami");
      const cleanerStatus = document.getElementById("cleaner-status");
      const rankCleanerSelect = document.getElementById("rank-cleaner-select");
      const rankStatus = document.getElementById("rank-status");
      const leaderboardBody = document.getElementById("leaderboard-body");
      const summary = document.getElementById("summary");

      let cleaners = []; // [{cleaner_id, username, rank, score}]

      function setStatus(el, text, kind) {
        el.textContent = text;
        el.className = "status" + (kind ? " " + kind : "");
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
      }

      async function api(path, options) {
        const res = await fetch(path, options);
        if (res.status === 401) {
          location.href = "/";
          throw new Error("not signed in");
        }
        if (res.status === 403) {
          // Signed in but not an admin — wrong dashboard.
          location.href = "/cleaner.html";
          throw new Error("not an admin");
        }
        return res;
      }

      async function confirmAdmin() {
        // GET /api/me is 404 ("Not a cleaner") for an authenticated admin,
        // 200 for a cleaner session, 401 for no session.
        const res = await fetch("/api/me");
        if (res.status === 401) {
          location.href = "/";
          throw new Error("not signed in");
        }
        if (res.status === 200) {
          location.href = "/cleaner.html";
          throw new Error("not an admin");
        }
        whoami.textContent = "admin";
      }

      async function loadProperties() {
        // Read-only here: the Cleaners card groups by owner, but property
        // management itself lives on /properties.html now.
        const res = await api("/api/properties");
        return res.json();
      }

      async function loadLeaderboard() {
        const res = await api("/api/leaderboard");
        return res.json();
      }

      function renderLeaderboard(entries, properties) {
        // Group properties by owner so each cleaner's row lists theirs.
        const byOwner = new Map();
        for (const property of properties ?? []) {
          if (!property.owner) continue;
          if (!byOwner.has(property.owner)) byOwner.set(property.owner, []);
          byOwner.get(property.owner).push(property.name);
        }

        leaderboardBody.innerHTML = "";
        for (const entry of entries) {
          const tr = document.createElement("tr");
          const scoreText = entry.score === null || entry.score === undefined ? "—" : entry.score.toFixed(2);
          const owned = byOwner.get(entry.username) ?? [];
          const propsText = owned.length
            ? owned.map(escapeHtml).join(", ")
            : '<span class="muted">none</span>';
          tr.innerHTML = `
            <td>${escapeHtml(entry.username)}</td>
            <td><span class="pill">${entry.rank}</span></td>
            <td class="num">${scoreText}</td>
            <td>${propsText}</td>
          `;
          leaderboardBody.appendChild(tr);
        }
      }

      function populateRankSelect() {
        const previousValue = rankCleanerSelect.value;
        rankCleanerSelect.innerHTML = cleaners
          .map((c) => `<option value="${c.cleaner_id}">${escapeHtml(c.username)} (${c.rank})</option>`)
          .join("");
        if (previousValue && cleaners.some((c) => String(c.cleaner_id) === previousValue)) {
          rankCleanerSelect.value = previousValue;
        }
      }

      async function loadCleanersIntoSelects() {
        cleaners = await loadLeaderboard();
        populateRankSelect();
      }

      function renderSummary(properties, cleanerList) {
        const claimed = properties.filter((p) => p.owner).length;
        const cleanerWord = cleanerList.length === 1 ? "cleaner" : "cleaners";
        const propertyWord = properties.length === 1 ? "property" : "properties";
        summary.textContent =
          `${cleanerList.length} ${cleanerWord} · ${properties.length} ${propertyWord} ` +
          `(${claimed} claimed, ${properties.length - claimed} unclaimed)`;
      }

      async function refreshAll() {
        const [properties] = await Promise.all([loadProperties(), loadCleanersIntoSelects()]);
        renderLeaderboard(cleaners, properties);
        renderSummary(properties, cleaners);
      }

      document.getElementById("add-cleaner-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);
        setStatus(cleanerStatus, "Creating…", "");
        try {
          const res = await api("/api/cleaners", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ username: data.get("username"), password: data.get("password") }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            setStatus(cleanerStatus, body.error ?? "Could not create account.", "error");
            return;
          }
          const created = await res.json();
          form.reset();
          setStatus(cleanerStatus, `Created cleaner "${created.username}".`, "ok");
          await refreshAll();
        } catch {
          setStatus(cleanerStatus, "Could not reach the server.", "error");
        }
      });

      document.getElementById("rank-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const cleanerId = rankCleanerSelect.value;
        const rank = event.target.rank.value;
        if (!cleanerId) {
          setStatus(rankStatus, "Create a cleaner account first.", "error");
          return;
        }
        setStatus(rankStatus, "Updating…", "");
        try {
          const res = await api(`/api/cleaners/${cleanerId}/rank`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ rank }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            setStatus(rankStatus, body.error ?? "Could not update rank.", "error");
            return;
          }
          setStatus(rankStatus, "Rank updated.", "ok");
          await refreshAll();
        } catch {
          setStatus(rankStatus, "Could not reach the server.", "error");
        }
      });

      document.getElementById("logout").addEventListener("click", async () => {
        await fetch("/logout", { method: "POST" });
        location.href = "/";
      });

      (async () => {
        try {
          await confirmAdmin();
          await refreshAll();
        } catch (err) {
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
