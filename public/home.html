<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      /* Chat-specific layout only — everything else reuses style.css tokens. */
      body.chat-body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding-bottom: 0;
      }
      main.chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        margin-bottom: 1rem;
        width: 100%;
        max-width: 44rem;
        margin-left: auto;
        margin-right: auto;
      }
      #chat-log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        padding: 0.5rem 0.1rem 0.75rem;
      }
      .bubble {
        max-width: 90%;
        padding: 0.65rem 0.95rem;
        border-radius: 1.1rem;
        font-size: 0.95rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .bubble.user {
        align-self: flex-end;
        background: var(--accent);
        color: var(--accent-contrast);
        border-bottom-right-radius: 0.2rem;
      }
      .bubble.assistant {
        align-self: flex-start;
        background: var(--surface-sunk);
        color: var(--text);
        border: 1px solid var(--border);
        border-bottom-left-radius: 0.2rem;
      }
      .bubble.assistant.error {
        background: var(--danger-soft);
        border-color: color-mix(in srgb, var(--danger) 45%, transparent);
        color: var(--danger);
      }
      .bubble.pending {
        color: var(--text-muted);
        font-style: italic;
      }
      #chat-empty {
        margin: auto;
        text-align: center;
      }
      form#chat-form {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        flex-shrink: 0;
        width: 100%;
        max-width: 44rem;
        margin-left: auto;
        margin-right: auto;
      }
      .chat-input-row {
        display: flex;
        flex-direction: row;
        gap: 0.4rem;
        align-items: flex-end;
        border: 1px solid var(--border-strong);
        border-radius: 1.1rem;
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 0.4rem 0.4rem 0.4rem 0.9rem;
      }
      .chat-input-row:focus-within { border-color: var(--accent); }
      .chat-input-row textarea {
        flex: 1;
        resize: none;
        border: none;
        background: transparent;
        color: var(--text);
        padding: 0.35rem 0;
        font: inherit;
        line-height: 1.4;
        max-height: 8rem;
      }
      .chat-input-row textarea:focus { outline: none; }
      .chat-input-row button.primary {
        border-radius: 0.85rem;
        padding: 0.55rem 1.1rem;
      }
    </style>
  </head>
  <body class="chat-body">
    <header class="topbar">
      <div class="brand-group">
        <a href="/home.html" class="brand-mark" aria-label="Go to home">CP</a>
        <h1>Assistant</h1>
      </div>
      <div class="who">
        <span id="whoami">loading…</span>
        <button id="logout" type="button">Sign out</button>
      </div>
    </header>

    <nav class="tabs" id="nav-links"></nav>

    <main class="chat-main card">
      <div id="chat-log">
        <p id="chat-empty" class="muted">
          Ask about your score, the leaderboard, or properties.
        </p>
      </div>
    </main>

    <form id="chat-form">
      <div id="chat-attach" class="inline-form" hidden>
        <label class="visually-hidden" for="chat-file-input">Attach a file</label>
        <input type="file" id="chat-file-input" accept=".csv,text/csv" />
        <span id="chat-file-name" class="muted">No file attached</span>
      </div>
      <p id="chat-file-error" class="status" role="status"></p>
      <div class="chat-input-row">
        <label class="visually-hidden" for="chat-input">Message</label>
        <textarea
          id="chat-input"
          rows="1"
          placeholder="Ask a question…"
          autocomplete="off"
          required
        ></textarea>
        <button type="submit" class="primary">Send</button>
      </div>
    </form>

    <footer><a href="/readme/">About this app</a></footer>

    <script>
      const whoami = document.getElementById("whoami");
      const navLinks = document.getElementById("nav-links");
      const chatLog = document.getElementById("chat-log");
      const chatEmpty = document.getElementById("chat-empty");
      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");
      const chatAttach = document.getElementById("chat-attach");
      const chatFileInput = document.getElementById("chat-file-input");
      const chatFileName = document.getElementById("chat-file-name");
      const chatFileError = document.getElementById("chat-file-error");

      const MAX_FILE_BYTES = 262144; // 256 KB — matches the server's own cap.

      function setFileError(text) {
        chatFileError.textContent = text ?? "";
        chatFileError.className = "status" + (text ? " error" : "");
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
      }

      function addBubble(text, kind) {
        chatEmpty.hidden = true;
        const div = document.createElement("div");
        div.className = "bubble " + kind;
        div.textContent = text;
        chatLog.appendChild(div);
        chatLog.scrollTop = chatLog.scrollHeight;
        return div;
      }

      function renderNav(role) {
        const pages =
          role === "admin"
            ? [
                ["/admin.html", "Dashboard"],
                ["/cleaners.html", "Cleaners"],
                ["/properties.html", "Properties"],
                ["/reviews.html", "Reviews"],
              ]
            : [["/cleaner.html", "My dashboard"]];
        navLinks.innerHTML = pages
          .map(([href, label]) => `<a href="${href}">${escapeHtml(label)}</a>`)
          .join("");
      }

      // Same role-detection pattern as every other page: GET /api/me is 200
      // for a cleaner session, 404 ("Not a cleaner") for an authenticated
      // admin, 401 for no session at all.
      async function detectRole() {
        const res = await fetch("/api/me");
        if (res.status === 401) {
          location.href = "/";
          throw new Error("not signed in");
        }
        if (res.status === 200) {
          whoami.textContent = "cleaner";
          renderNav("cleaner");
          return;
        }
        whoami.textContent = "admin";
        renderNav("admin");
        chatAttach.hidden = false;
      }

      async function sendMessage(message, file) {
        addBubble(message, "user");
        const pending = addBubble("Thinking…", "bubble assistant pending");
        chatInput.disabled = true;
        chatForm.querySelector("button[type=submit]").disabled = true;
        try {
          const requestBody = { message };
          if (file) {
            requestBody.file = { name: file.name, content: await file.text() };
          }
          const res = await fetch("/api/assistant", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(requestBody),
          });
          if (res.status === 401) {
            location.href = "/";
            return;
          }
          pending.remove();
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            addBubble(body.error ?? "The assistant could not answer that.", "assistant error");
            return;
          }
          const body = await res.json();
          addBubble(body.reply ?? "", "assistant");
          if (file) {
            chatFileInput.value = "";
            chatFileName.textContent = "No file attached";
          }
        } catch {
          pending.remove();
          addBubble("Could not reach the server.", "assistant error");
        } finally {
          chatInput.disabled = false;
          chatForm.querySelector("button[type=submit]").disabled = false;
          chatInput.focus();
        }
      }

      chatFileInput.addEventListener("change", () => {
        setFileError("");
        const file = chatFileInput.files?.[0];
        chatFileName.textContent = file ? file.name : "No file attached";
      });

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;
        const file = !chatAttach.hidden ? (chatFileInput.files?.[0] ?? null) : null;
        if (file && file.size > MAX_FILE_BYTES) {
          setFileError("That file is too large (max 256 KB).");
          return;
        }
        setFileError("");
        chatInput.value = "";
        sendMessage(message, file).catch((err) => console.error(err));
      });

      chatInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      document.getElementById("logout").addEventListener("click", async () => {
        await fetch("/logout", { method: "POST" });
        location.href = "/";
      });

      detectRole().catch((err) => console.error(err));
    </script>
  </body>
</html>
