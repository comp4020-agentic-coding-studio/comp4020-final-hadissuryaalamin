<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Properties · StayCrew</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="properties" data-role="admin">
    <section class="hero">
      <div class="hero-main">
        <span class="hero-icon" id="hero-icon"></span>
        <div class="hero-text">
          <span class="eyebrow">Allocation</span>
          <h1>Properties</h1>
          <p class="hero-sub">Every unit and who holds it. Cleaners claim from their own page.</p>
        </div>
      </div>
      <dl class="hero-stats">
        <div><dt>Total</dt><dd id="hs-total">—</dd></div>
        <div><dt>Claimed</dt><dd id="hs-claimed">—</dd></div>
        <div><dt>Open</dt><dd id="hs-open">—</dd></div>
      </dl>
    </section>

    <section class="card">
      <h2 class="card-title" id="add-title"></h2>
      <form id="add-property-form" class="inline-form">
        <label>Name <input type="text" name="name" autocomplete="off" required /></label>
        <label>Address <input type="text" name="address" autocomplete="off" required /></label>
        <button type="submit" class="primary">Add property</button>
      </form>
      <p id="properties-status" class="status" role="status"></p>
    </section>

    <section id="properties-section" class="card flush">
      <div class="card-head">
        <div>
          <h2 class="card-title" id="all-title"></h2>
          <p>A claim is held in the database until the cleaner releases it.</p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Property</th><th>Address</th><th>Held by</th><th>State</th><th><span class="visually-hidden">Actions</span></th></tr>
          </thead>
          <tbody id="properties-body"></tbody>
        </table>
      </div>
      <p id="properties-empty" class="empty" style="margin: 0 1.5rem 1.5rem" hidden>No properties yet. Add the first one above.</p>
    </section>

    <footer><a href="/readme/">About this app</a></footer>

    <script src="/realtime.js"></script>
    <script src="/shell.js"></script>
    <script>
      const { icon, avatar, escapeHtml } = StayCrew;
      const propertiesBody = document.getElementById("properties-body");
      const propertiesStatus = document.getElementById("properties-status");
      const TRASH_ICON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

      document.getElementById("hero-icon").innerHTML = icon("building");
      document.getElementById("add-title").innerHTML = icon("plus") + "Add a property";
      document.getElementById("all-title").innerHTML = icon("building") + "All properties";

      function setStatus(el, text, kind) {
        el.textContent = text;
        el.className = "status" + (kind ? " " + kind : "");
      }

      async function api(path, options) {
        const res = await fetch(path, options);
        if (res.status === 401) {
          location.href = "/";
          throw new Error("not signed in");
        }
        if (res.status === 403) {
          location.href = "/cleaner.html";
          throw new Error("not an admin");
        }
        return res;
      }

      async function confirmAdmin() {
        const res = await fetch("/api/me");
        if (res.status === 401) {
          location.href = "/";
          throw new Error("not signed in");
        }
        if (res.status === 200) {
          location.href = "/cleaner.html";
          throw new Error("not an admin");
        }
        StayCrew.setUser("admin", "admin");
      }

      async function loadProperties() {
        const res = await api("/api/properties");
        return res.json();
      }

      function renderProperties(properties) {
        const claimed = properties.filter((p) => p.owner).length;
        document.getElementById("hs-total").textContent = properties.length;
        document.getElementById("hs-claimed").textContent = claimed;
        document.getElementById("hs-open").textContent = properties.length - claimed;
        document.getElementById("properties-empty").hidden = properties.length > 0;
        StayCrew.setMeter({ label: "Properties claimed", used: claimed, total: properties.length, note: `${properties.length - claimed} open` });

        propertiesBody.innerHTML = "";
        for (const property of properties) {
          const tr = document.createElement("tr");
          tr.dataset.id = property.id;
          renderPropertyRow(tr, property);
          propertiesBody.appendChild(tr);
        }
      }

      function renderPropertyRow(tr, property) {
        tr.className = property.owner ? "" : "row-open";
        const held = property.owner
          ? `<div class="who-cell">${avatar(property.owner)}<span>${escapeHtml(property.owner)}</span></div>`
          : '<span class="muted">unclaimed</span>';
        const state = property.owner
          ? `<span class="lock-state">${icon("lock")}Claimed</span>`
          : `<span class="lock-state open">${icon("plus")}Open</span>`;
        tr.innerHTML = `
          <td><span class="status-dot${property.owner ? "" : " open"}"></span><strong style="color:var(--text)">${escapeHtml(property.name)}</strong></td>
          <td class="muted">${escapeHtml(property.address)}</td>
          <td>${held}</td>
          <td>${state}</td>
          <td class="actions">
            <button type="button" class="ghost" data-edit="${property.id}">Edit</button>
            <button type="button" class="danger icon-btn" data-delete="${property.id}" title="Delete ${escapeHtml(property.name)}" aria-label="Delete ${escapeHtml(property.name)}">${TRASH_ICON}</button>
          </td>
        `;
        tr.querySelector("[data-edit]").addEventListener("click", () => startEditProperty(tr, property));
        tr.querySelector("[data-delete]").addEventListener("click", () => deleteProperty(property.id));
      }

      function startEditProperty(tr, property) {
        tr.className = "";
        tr.innerHTML = `
          <td colspan="4">
            <div class="edit-fields">
              <input type="text" value="${escapeHtml(property.name)}" data-field="name" aria-label="Name" />
              <input type="text" value="${escapeHtml(property.address)}" data-field="address" aria-label="Address" />
            </div>
          </td>
          <td class="actions">
            <button type="button" class="primary" data-save>Save</button>
            <button type="button" class="ghost" data-cancel>Cancel</button>
          </td>
        `;
        tr.querySelector("[data-save]").addEventListener("click", () => saveProperty(tr, property.id));
        tr.querySelector("[data-cancel]").addEventListener("click", () => refreshAll());
      }

      async function saveProperty(tr, id) {
        const name = tr.querySelector('[data-field="name"]').value;
        const address = tr.querySelector('[data-field="address"]').value;
        setStatus(propertiesStatus, "Saving…", "");
        try {
          const res = await api(`/api/properties/${id}`, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ name, address }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            setStatus(propertiesStatus, body.error ?? "Could not save.", "error");
            return;
          }
          setStatus(propertiesStatus, "Saved.", "ok");
          await refreshAll();
        } catch {
          setStatus(propertiesStatus, "Could not reach the server.", "error");
        }
      }

      async function deleteProperty(id) {
        if (!confirm("Delete this property?")) return;
        setStatus(propertiesStatus, "Deleting…", "");
        try {
          const res = await api(`/api/properties/${id}`, { method: "DELETE" });
          if (!res.ok && res.status !== 204) {
            const body = await res.json().catch(() => ({}));
            setStatus(propertiesStatus, body.error ?? "Could not delete.", "error");
            return;
          }
          setStatus(propertiesStatus, "Deleted.", "ok");
          await refreshAll();
        } catch {
          setStatus(propertiesStatus, "Could not reach the server.", "error");
        }
      }

      document.getElementById("add-property-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);
        setStatus(propertiesStatus, "Adding…", "");
        try {
          const res = await api("/api/properties", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ name: data.get("name"), address: data.get("address") }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            setStatus(propertiesStatus, body.error ?? "Could not add property.", "error");
            return;
          }
          form.reset();
          setStatus(propertiesStatus, "Added.", "ok");
          await refreshAll();
        } catch {
          setStatus(propertiesStatus, "Could not reach the server.", "error");
        }
      });

      async function refreshAll() {
        const properties = await loadProperties();
        renderProperties(properties);
      }

      document.getElementById("logout").addEventListener("click", async () => {
        await fetch("/logout", { method: "POST" });
        location.href = "/";
      });

      // Live updates (public/realtime.js): a claim/release elsewhere never
      // removes a row here, it just changes who holds it.
      onRealtime("pick:claimed", () => refreshAll().catch((err) => console.error(err)));
      onRealtime("pick:released", () => refreshAll().catch((err) => console.error(err)));

      (async () => {
        try {
          await confirmAdmin();
          await refreshAll();
        } catch (err) {
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
